global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Backend Spring Boot (Actuator + Micrometer). Si la API corre en otra máquina o puerto, cambia el target.
  - job_name: urbanpulse-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
