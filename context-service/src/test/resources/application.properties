# Configuración de pruebas para context-service
spring.datasource.url=jdbc:h2:mem:context_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.hibernate.ddl-auto=none

app.sync.enabled=false
app.opendata.base-url=https://mock.opendata.local
app.aemet.api-key=
app.aemet.base-url=https://mock.aemet.local
