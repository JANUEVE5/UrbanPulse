# =====================================================================
# Configuración de Context Service (Twelve-Factor, factor III).
# Microservicio de Contexto Urbano y Meteorológico (Open Data + AEMET).
# =====================================================================

# --- Servidor ---
server.port=${SERVER_PORT:8082}

# --- Base de datos independiente (PostgreSQL en puerto 5433 por defecto) ---
spring.datasource.url=${CONTEXT_DATASOURCE_URL:jdbc:postgresql://localhost:5433/urbanpulse_context}
spring.datasource.username=${CONTEXT_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${CONTEXT_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# Inicialización idempotente del esquema; los snapshots externos no se cargan como datos iniciales.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:8080}

# --- Open Data Málaga (ADR-015, ADR-019) ---
app.opendata.base-url=${OPENDATA_BASE_URL:https://datosabiertos.malaga.eu}
app.opendata.sync.cron=${OPENDATA_SYNC_CRON:0 0 4 * * *}

# --- AEMET OpenData (ADR-019) ---
app.aemet.base-url=${AEMET_BASE_URL:https://opendata.aemet.es/opendata/api}
app.aemet.api-key=${AEMET_API_KEY:}
app.aemet.municipio-codigo=${AEMET_MUNICIPIO_CODIGO:29067}
app.aemet.station-code=${AEMET_STATION_CODE:6156X}
app.aemet.sync.cron=${AEMET_SYNC_CRON:0 0 * * * *}

# Sincronizaciones independientes y no bloqueantes al iniciar.
app.sync.enabled=${CONTEXT_SYNC_ENABLED:true}

# --- Resiliencia (Circuit Breaker y Caché) ---
app.resilience.circuit-breaker.failure-threshold=${CIRCUIT_BREAKER_THRESHOLD:3}
app.resilience.circuit-breaker.wait-duration-seconds=${CIRCUIT_BREAKER_WAIT_SECONDS:60}

# --- Observabilidad (Actuator + Prometheus) ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true
