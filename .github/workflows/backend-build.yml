name: Validacion Backend Spring Boot

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    
    # Levantamos un PostgreSQL temporal idéntico al de tu entorno local
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: urbanpulse
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Compilar y verificar Backend
      working-directory: ./backend
      run: mvn clean verify