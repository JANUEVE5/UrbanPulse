# =====================================================================
# Configuración de UrbanPulse (Twelve-Factor, factor III).
# Todo lo que cambia entre entornos se lee de variables de entorno con la
# sintaxis ${VARIABLE:valor-por-defecto}. Los valores por defecto son SOLO
# para desarrollo local. Las variables están documentadas en .env.example.
# =====================================================================

# --- Servidor ---
server.port=${SERVER_PORT:8080}

# --- Conexión a PostgreSQL ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/urbanpulse}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Inicialización del esquema (ADR-006): schema.sql y data.sql en cada arranque ---
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# --- JPA: Hibernate nunca genera DDL (ADR-006) ---
spring.jpa.hibernate.ddl-auto=none
# Mostrar las consultas SQL en los logs (útil solo para depurar)
spring.jpa.show-sql=${SHOW_SQL:false}

# --- CORS: orígenes web que pueden llamar a la API, separados por comas ---
# Las apps nativas (Android/iOS) no usan CORS; solo afecta a la versión web.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081}

# --- Autenticación JWT (ADR-009) ---
# Clave para firmar los tokens (HS256, mínimo 32 caracteres). El valor por defecto es SOLO para
# desarrollo local: en cualquier entorno compartido debe definirse JWT_SECRET con un valor secreto.
app.jwt.secret=${JWT_SECRET:urbanpulse-dev-only-secret-change-me-0123456789}
# Minutos de validez de cada token
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# --- Activos urbanos desde Open Data Málaga (ADR-015) ---
# Portal del que se descargan los ficheros de cada fuente
app.opendata.base-url=${OPENDATA_BASE_URL:https://datosabiertos.malaga.eu}
# Sincronizar al arrancar y de forma periódica (false en los tests para no depender de internet)
app.opendata.sync.enabled=${OPENDATA_SYNC_ENABLED:true}
# Cuándo se repite la sincronización (cron de Spring: segundo minuto hora día mes día-semana)
app.opendata.sync.cron=${OPENDATA_SYNC_CRON:0 0 4 * * *}
